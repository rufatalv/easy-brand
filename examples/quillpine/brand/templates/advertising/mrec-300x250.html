<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Template: ad-mrec-01 · IAB medium rectangle 300×250 · Example, not an editor -->
  <title>Quillpine · 300×250 ad</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,50;1,9..144,400,50&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../template-base.css">
  <style>
    .canvas { width: 300px; height: 250px; padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--qp-rule); }
    .eyebrow { font-size: 10px; }
    .display { font-size: 38px; margin-top: 12px; }
    .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { height: 20px; }
    .btn { font-size: 13px; padding: 10px 14px; }
  </style>
</head>
<body>
  <div class="canvas">
    <p class="eyebrow" data-slot="eyebrow">Pricing</p>
    <h1 class="display" data-slot="headline">Two plans. No <mark>seat math</mark>.</h1>
    <div class="foot">
      <img class="logo" src="../../assets/logos/quillpine-logo.svg" alt="Quillpine">
      <span class="btn" data-slot="cta">Start writing →</span>
    </div>
  </div>
</body>
</html>
