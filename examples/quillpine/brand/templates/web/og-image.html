<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Template: web-og-01 · Open Graph 1200×630 · mirrors the site hero · Example, not an editor -->
  <title>Quillpine · OG image</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,50;1,9..144,400,50&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../template-base.css">
  <style>
    .canvas { width: 1200px; height: 630px; padding: 64px; display: grid; grid-template-columns: 7fr 5fr; gap: 56px; align-items: end; }
    .left { display: flex; flex-direction: column; height: 100%; }
    .logo { height: 32px; margin-bottom: auto; align-self: flex-start; }
    .eyebrow { font-size: 15px; margin-bottom: 20px; }
    .display { font-size: 84px; }
    .note { padding: 24px 24px 24px 72px; font-size: 18px; }
    .note p { margin: 0; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="left">
      <img class="logo" src="../../assets/logos/quillpine-logo.svg" alt="Quillpine">
      <p class="eyebrow" data-slot="eyebrow">Shared research notebook</p>
      <h1 class="display" data-slot="headline">Research that <mark>remembers</mark> itself.</h1>
    </div>
    <div class="ruled note" data-slot="artifact">
      <p class="meta">Interview 14 · 3 Mar</p>
      <p>Ops leads keep a private spreadsheet of <mark>every vendor call</mark>. Nobody else knows it exists.</p>
      <p>→ linked to <strong>Procurement map</strong></p>
      <p><span class="tag">#ops</span><span class="tag">#discovery</span></p>
    </div>
  </div>
</body>
</html>
